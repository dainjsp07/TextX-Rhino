# Builds and tests every push. Publishes a GitHub release for the version in VERSION when
#   * a version tag (v1.2.0) is pushed, or
#   * it is started by hand: Actions > build > Run workflow, with "Publish a release" ticked
#     (GitHub then creates the tag itself).
# The release contains the .yak package, the shareable zip and latest.json (the update feed that
# installed copies of Text X check).
name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:   # "Run workflow" button on the Actions tab
    inputs:
      publish:
        description: Publish a release for the version in the VERSION file
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read VERSION
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          "tag=v$v" >> $env:GITHUB_OUTPUT
          if ("${{ github.ref_type }}" -eq "tag" -and "v$v" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match VERSION ($v)."
          }

      - name: Build, test and package
        shell: pwsh
        run: |
          # Keep the output so that a failure can be shown on the run's summary page.
          $ok = $true
          try { ./tools/build.ps1 -UseRhinoNuGet *>&1 | Tee-Object -FilePath build.log }
          catch { $ok = $false; "ERROR: $_" | Tee-Object -FilePath build.log -Append }
          if ($ok -and $LASTEXITCODE -ne 0) { $ok = $false }
          if (-not $ok) {
            $esc = { param($t) $t.Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A') }
            $fails = Get-Content build.log | Where-Object { $_ -match '\bFAIL\b|error [A-Z]+[0-9]+|ERROR:' } | Select-Object -First 15
            foreach ($f in $fails) { Write-Output ("::error title=Build::" + (& $esc $f)) }
            $tail = (Get-Content build.log -Tail 40 | ForEach-Object { if ($_.Length -gt 220) { $_.Substring(0, 220) } else { $_ } }) -join "`n"
            Write-Output ("::error title=Last lines of the build log::" + (& $esc $tail))
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: textx-package
          path: dist/**

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Text X ${{ steps.version.outputs.tag }}
          body_path: dist/${{ steps.version.outputs.tag }}/release-notes.md
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          files: |
            dist/${{ steps.version.outputs.tag }}/*.yak
            dist/${{ steps.version.outputs.tag }}/*.zip
            dist/${{ steps.version.outputs.tag }}/latest.json
            dist/${{ steps.version.outputs.tag }}/SHA256SUMS.txt
