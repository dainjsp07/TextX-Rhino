# Builds and tests every push; publishes a GitHub release when a version tag (v1.2.0) is pushed.
# The release contains the .yak package, the shareable zip and latest.json (the update feed that
# installed copies of Text X check).
name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:   # "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Check that the tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match VERSION ($v)." }

      - name: Build, test and package
        shell: pwsh
        run: |
          # Keep the output so that a failure can be shown on the run's summary page.
          $ok = $true
          try { ./tools/build.ps1 -UseRhinoNuGet *>&1 | Tee-Object -FilePath build.log }
          catch { $ok = $false; "ERROR: $_" | Tee-Object -FilePath build.log -Append }
          if ($ok -and $LASTEXITCODE -ne 0) { $ok = $false }
          if (-not $ok) {
            $esc = { param($t) $t.Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A') }
            $fails = Get-Content build.log | Where-Object { $_ -match '\bFAIL\b|error [A-Z]+[0-9]+|ERROR:' } | Select-Object -First 15
            foreach ($f in $fails) { Write-Output ("::error title=Build::" + (& $esc $f)) }
            $tail = (Get-Content build.log -Tail 40 | ForEach-Object { if ($_.Length -gt 220) { $_.Substring(0, 220) } else { $_ } }) -join "`n"
            Write-Output ("::error title=Last lines of the build log::" + (& $esc $tail))
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: textx-package
          path: dist/**

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Text X ${{ github.ref_name }}
          body_path: dist/${{ github.ref_name }}/release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/${{ github.ref_name }}/*.yak
            dist/${{ github.ref_name }}/*.zip
            dist/${{ github.ref_name }}/latest.json
            dist/${{ github.ref_name }}/SHA256SUMS.txt
